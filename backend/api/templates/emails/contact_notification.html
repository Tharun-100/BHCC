<!doctype html>
<html lang="en">
<body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#153247">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#fff;border-radius:16px;overflow:hidden">
        <tr><td style="background:#087f8c;color:#fff;padding:24px 32px"><strong style="font-size:20px">New website contact message</strong></td></tr>
        <tr><td style="padding:32px">
          <p><strong>Name:</strong> {{ sender_name }}</p>
          <p><strong>Email:</strong> <a href="mailto:{{ sender_email }}">{{ sender_email }}</a></p>
          <p><strong>Subject:</strong> {{ inquiry_subject }}</p>
          <div style="margin-top:24px;padding:20px;background:#f4f7fb;border-radius:12px">{{ message|linebreaksbr }}</div>
          <p style="color:#5d7180">Reply directly to this email to contact {{ sender_name }}.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
